name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        run: npm install --no-audit --no-fund

      - name: Compilar Aplicação Web (Vite)
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configurar Android SDK e Licenças
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Sincronizar Capacitor com Android
        run: |
          npx cap sync android || (npx cap add android && npx cap sync android)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Conceder Permissões de Execução ao Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Encontrar e Renomear APK
        run: |
          mkdir -p output-apk
          APK_FOUND=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" output-apk/CineLocal-Android.apk
            echo "APK copiado com sucesso de $APK_FOUND"
          else
            echo "Nenhum APK gerado encontrado!"
            exit 1
          fi

      - name: Fazer Upload do APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CineLocal-Android-APK
          path: output-apk/CineLocal-Android.apk
          retention-days: 30

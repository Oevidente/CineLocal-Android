name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm install --no-audit --no-fund

      - name: Compilar Aplicação Web (Vite)
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar Capacitor com Android
        run: |
          npx cap sync android || (npx cap add android && npx cap sync android)

      - name: Conceder Permissões de Execução ao Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Encontrar e Renomear APK
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/CineLocal-Android.apk \;

      - name: Fazer Upload do APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: CineLocal-Android-APK
          path: output-apk/CineLocal-Android.apk
          retention-days: 30
